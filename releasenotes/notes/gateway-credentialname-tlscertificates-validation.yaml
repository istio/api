apiVersion: release-notes/v2
kind: bug-fix
area: traffic-management
issue: []
releaseNotes:
  - |
    **Fixed** the `Gateway` CRD validation rule that rejects setting both `credentialName` and
    `tlsCertificates` in server TLS settings. The rule previously checked `credentialNames` instead
    of `credentialName`, so the combination was accepted by the API server.
