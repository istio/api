apiVersion: release-notes/v2
kind: feature
area: traffic-management
issue:
  - https://github.com/istio/istio/issues/62499
releaseNotes:
  - |
    **Added** `retryBudget` field to `portLevelSettings` in `DestinationRule`. Like other
    port-level fields, a destination-level `retryBudget` is not inherited by ports with
    port-level settings.
