_err: 'only one of credentialNames or tlsCertificates can be set'
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: credential-names-and-tls-certificates
spec:
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "*"
    tls:
      mode: SIMPLE
      credentialNames:
      - foo
      tlsCertificates:
      - serverCertificate: /etc/certs/cert.pem
        privateKey: /etc/certs/key.pem
---
_err: 'only one of credentialName or credentialNames can be set'
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: credential-name-and-credential-names
spec:
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "*"
    tls:
      mode: SIMPLE
      credentialName: foo
      credentialNames:
      - bar
---
_err: 'only one of credentialName or tlsCertificates can be set'
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: credential-name-and-tls-certificates
spec:
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "*"
    tls:
      mode: SIMPLE
      credentialName: foo
      tlsCertificates:
      - serverCertificate: /etc/certs/cert.pem
        privateKey: /etc/certs/key.pem
